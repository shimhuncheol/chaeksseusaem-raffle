<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>책쓰샘 행운 추첨</title>
<style>
/* VOICE: 레트로 오픈 이벤트 포스터 — 신나고 촌스럽게 화려하게, 멀리서도 한눈에
   IDEA: 오락실 구슬 판(플링코) — 금빛 구슬이 핀을 튕기며 내려와 '도서'와 '간식' 칸 중 하나에 쏙
   PICTURE: 전구 두른 갈색 오락기 판, 크림색 핀, 빨강·청록 도착 칸, 마지막 순간 슬로모션과 당첨 연출
   COLOUR/TYPE: 토마토 빨강·겨자·크림·짙은 갈색, 핑크 네온 포인트 / 페이퍼로지 한 가족
   LAYOUT: 위 기울어진 제목·리본 → 큰 구슬 판과 오른쪽 버튼·확률·최근 결과 → 수정은 오른쪽 서랍 */
@font-face{font-family:Paperlogy;src:url(fonts/Paperlogy-4Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Paperlogy;src:url(fonts/Paperlogy-6SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Paperlogy;src:url(fonts/Paperlogy-8ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:Paperlogy;src:url(fonts/Paperlogy-9Black.woff2) format("woff2");font-weight:900;font-display:swap}
:root{color-scheme:light;--red:#d8252e;--red2:#a8141d;--mus:#f2b632;--cream:#fff3d6;--brown:#2b130b;--pink:#ff4fa3;--mute:#e9cfa6;--F:Paperlogy,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box;min-width:0}
html{background:var(--red)}
body{margin:0;min-height:100vh;color:var(--cream);font:600 16px/1.55 var(--F);overflow-x:clip;
  background:radial-gradient(circle at 1px 1px,rgba(43,19,11,.16) 1.2px,transparent 1.6px) 0 0/11px 11px,repeating-conic-gradient(from 0deg at 28% 30%,rgba(255,243,214,.09) 0 7deg,transparent 7deg 15deg),linear-gradient(152deg,var(--red) 0 54%,var(--mus) 54% 100%);background-attachment:fixed}
h1,h2,.big{font-family:var(--F);font-weight:900;line-height:1.05;margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;border-radius:12px;border:2.5px solid var(--mus);background:var(--brown);color:var(--cream);padding:0 14px;font-weight:800;box-shadow:3px 3px 0 rgba(43,19,11,.45)}
button:hover{border-color:var(--cream)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(43,19,11,.45)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.stars i{position:absolute;background:var(--cream);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:twinkle var(--d) ease-in-out infinite alternate}
@keyframes twinkle{from{transform:scale(.3) rotate(0);opacity:.2}to{transform:scale(1) rotate(45deg);opacity:.95}}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:22px max(3vw,14px) 40px}
.top{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:center;justify-content:space-between;margin-bottom:6px}
.tag{display:inline-block;background:var(--cream);color:var(--red);font:900 15px var(--F);padding:4px 14px;border:2.5px solid var(--brown);box-shadow:3px 3px 0 var(--brown);transform:rotate(-4deg);margin:0 0 10px 4px}
.title{font-size:clamp(40px,5.4vw,68px);color:var(--cream);-webkit-text-stroke:2px var(--brown);paint-order:stroke fill;text-shadow:3px 3px 0 var(--red2),6px 6px 0 var(--brown);transform:rotate(-3deg);transform-origin:left}
.sub{display:inline-block;margin:14px 0 0;background:var(--brown);color:var(--cream);border:2.5px solid var(--mus);border-radius:12px;padding:6px 14px;font-weight:800;box-shadow:3px 3px 0 rgba(43,19,11,.4)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.edit{background:var(--red);color:var(--cream);border-color:var(--cream);box-shadow:4px 4px 0 var(--brown)}
.stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);gap:clamp(20px,3vw,40px);align-items:center}
@media(max-width:920px){.stage{grid-template-columns:minmax(0,1fr)}}
.boardwrap{position:relative;width:min(100%,52vh,580px);margin:6px auto 0}
#board{display:block;width:100%;aspect-ratio:600/820;filter:drop-shadow(8px 10px 0 rgba(43,19,11,.45));cursor:pointer}
.side{display:grid;gap:16px}
.card{background:rgba(43,19,11,.93);border:3px solid var(--mus);border-radius:18px;padding:16px 18px;box-shadow:6px 6px 0 rgba(43,19,11,.4)}
.card h2{font-size:22px;color:var(--mus);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:10px}
.card h2 span{font:600 14px var(--F);color:var(--mute)}
.go{width:100%;min-height:78px;border:3.5px solid var(--brown);border-radius:18px;background:linear-gradient(180deg,#ffd56b,var(--mus) 55%,#d4930f);color:var(--brown);font:900 32px/1 var(--F);box-shadow:0 7px 0 var(--brown),0 0 30px rgba(255,79,163,.35);animation:glow 1.6s ease-in-out infinite}
.go small{display:block;font:800 14px var(--F);margin-top:6px;opacity:.75}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--brown)}
.go:disabled{animation:none}
@keyframes glow{50%{box-shadow:0 7px 0 var(--brown),0 0 50px rgba(255,79,163,.75)}}
.ball{--c:#f2b632;width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font:900 12px/1 var(--F);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);background:radial-gradient(circle at 34% 28%,#fff 0 7%,var(--c) 38%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:2px 3px 0 rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.25);border:2px solid var(--cream);overflow:hidden;padding:2px;text-align:center;word-break:keep-all}
.balls{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.balls .ball.pop{animation:pop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-180deg)}}
.empty{color:var(--mute);margin:0;font-size:15px}
.odds{display:grid;gap:10px}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;row-gap:6px;align-items:center;padding:10px 12px;border-radius:12px;border:2px solid #6b4a2a;background:rgba(255,243,214,.05)}
.orow .ball{grid-row:1/3}
.on{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.on small{display:block;font-weight:600;color:var(--mute);font-size:13px}
.pct{font:900 32px/1 var(--F);color:var(--mus);font-variant-numeric:tabular-nums;white-space:nowrap;grid-row:1/3;grid-column:3}
.bar{grid-column:2/3;height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:repeating-linear-gradient(135deg,var(--mus) 0 8px,#ffd56b 8px 16px);transition:width .5s}
.soldout{opacity:.5}
.mini{display:flex;flex-wrap:wrap;gap:8px}
.mini button{flex:1 1 auto;font-size:15px}
.foot{margin-top:26px;text-align:center;color:var(--brown);font-size:13px;font-weight:800}
.win{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;cursor:pointer;background:repeating-conic-gradient(from 0deg at 50% 50%,#d8252e 0 9deg,#b81b24 9deg 18deg)}
.win.jack{background:repeating-conic-gradient(from 0deg at 50% 50%,#f2b632 0 9deg,#d8252e 9deg 18deg)}
.win::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(43,19,11,.2) 1.2px,transparent 1.6px) 0 0/11px 11px,radial-gradient(circle,transparent 30%,rgba(43,19,11,.55) 100%)}
.wrays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,rgba(255,243,214,.45) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 50%);mask:radial-gradient(circle,#000 8%,transparent 50%);animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wcard{position:relative;text-align:center;display:grid;justify-items:center;gap:14px;padding:20px;animation:card .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes card{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.wk{font-size:clamp(50px,9.5vw,120px);color:var(--cream);-webkit-text-stroke:3px var(--brown);paint-order:stroke fill;text-shadow:4px 4px 0 var(--mus),9px 9px 0 var(--brown);transform:rotate(-4deg);animation:wob 1.2s ease-in-out infinite}
.jack .wk{font-size:clamp(80px,16vw,200px);text-shadow:5px 5px 0 var(--red),11px 11px 0 var(--brown)}
@keyframes wob{50%{transform:rotate(-2deg) scale(1.06)}}
.wball{width:clamp(130px,20vw,200px);height:clamp(130px,20vw,200px);font-size:clamp(28px,4.4vw,44px);border:6px solid var(--cream);box-shadow:0 0 0 6px var(--brown),0 0 60px 20px rgba(255,79,163,.55),10px 14px 0 6px rgba(43,19,11,.4);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) scale(1.04)}}
.wname{font-size:clamp(34px,6vw,72px);background:var(--brown);color:var(--cream);border:4px solid var(--mus);border-radius:18px;padding:10px 28px;box-shadow:6px 6px 0 rgba(43,19,11,.5)}
.wok{margin-top:6px;padding:0 26px}
.flash{position:fixed;inset:0;background:var(--cream);opacity:0;pointer-events:none;z-index:55}
.flash.on{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(4px,-2px)}}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.scrim{position:fixed;inset:0;background:rgba(43,19,11,.55);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);z-index:41;background:var(--brown);border-left:5px solid var(--mus);box-shadow:-14px 0 0 rgba(43,19,11,.3);overflow:auto;padding:18px 18px 40px;display:grid;gap:18px;align-content:start;transform:translateX(105%);transition:transform .3s ease}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--brown);padding:10px 0;z-index:2}
.dh h2{font-size:28px;color:var(--mus)}
.sec{display:grid;gap:10px;padding:16px;border-radius:16px;border:2px solid #6b4a2a;background:rgba(255,243,214,.04)}
.sec h3{margin:0;font-size:18px;font-weight:900;color:var(--mus)}
.note{margin:0;color:var(--mute);font-size:14px;font-weight:400}
.note b{color:var(--cream)}
.lbl{display:grid;gap:4px;font-size:14px;font-weight:800;color:var(--mute)}
.drawer input:not([type=checkbox]):not([type=color]):not([type=range]),.drawer textarea{min-height:44px;width:100%;border-radius:10px;border:2px solid #6b4a2a;background:#1a0b06;color:var(--cream);padding:0 12px;font-size:16px;font-weight:600}
.drawer input:disabled{opacity:.45}
.drawer input[type=range]{width:100%;accent-color:#f2b632;min-height:44px}
.pe{display:grid;gap:8px;padding:12px;border-radius:14px;background:rgba(0,0,0,.25);border:2px solid #6b4a2a}
.pe h4{margin:0;font-size:14px;color:var(--mute)}
.pe1{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;align-items:center}
.pe1 input[type=color]{width:46px;height:44px;border:2px solid #6b4a2a;border-radius:10px;background:#1a0b06;padding:3px;cursor:pointer}
.pe2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.pe2 input[type=number]{text-align:right}
.chk{display:flex;gap:8px;align-items:center;min-height:44px;font-weight:900;color:var(--cream);padding:0 4px;white-space:nowrap}
.chk input{width:22px;height:22px;accent-color:#f2b632}
.pbig{font:900 22px var(--F);color:var(--cream)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 60px}
.seg button[aria-pressed=true]{background:var(--mus);color:var(--brown);border-color:var(--cream)}
.hist{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-height:300px;overflow:auto}
.hist li{display:grid;grid-template-columns:2.2em auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.3)}
.hist .ball{width:28px;height:28px;font-size:0;border-width:1.5px}
.hist .n,.hist .t{color:var(--mute);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--mus);color:var(--brown);font-weight:900;padding:12px 22px;border-radius:999px;border:3px solid var(--brown);opacity:0;transition:.25s;pointer-events:none;z-index:70;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media(max-width:600px){.pe2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pe2 .chk{grid-column:1/-1}.hist li{grid-template-columns:2em auto minmax(0,1fr)}.hist .t{display:none}.go{font-size:26px}.title{-webkit-text-stroke:1.5px var(--brown)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="wrap" id="app">
  <div class="top">
    <div><span class="tag">경기교육연구 페스타 2026</span><h1 class="title" id="title"></h1><p class="sub" id="subtitle"></p></div>
    <div class="tools"><button class="edit" id="openEdit">상품·화면 수정</button></div>
  </div>

  <div class="stage">
    <div class="boardwrap" id="boardWrap">
      <canvas id="board" role="img" aria-label="구슬이 장애물을 지나 도서 또는 간식 칸으로 떨어지는 구슬 판"></canvas>
    </div>
    <aside class="side">
      <button class="go" id="go">구슬 떨어뜨리기!<small>스페이스바를 누르거나 판을 눌러도 돼요</small></button>
      <div class="card">
        <h2>오늘의 상품</h2>
        <div class="odds" id="odds"></div>
      </div>
      <div class="card">
        <h2>최근 결과 <span id="cnt"></span></h2>
        <div class="balls" id="balls"></div>
      </div>
      <div class="mini">
        <button id="undo">방금 결과 되돌리기</button>
        <button id="snd"></button>
        <button id="fs">전체 화면</button>
      </div>
    </aside>
  </div>
  <p class="foot">경기독서교육연구회 책쓰샘 · 경기교육연구 페스타 2026</p>
</div>

<div class="win" id="win" hidden role="dialog" aria-modal="true" aria-label="당첨 결과">
  <div class="wrays"></div>
  <div class="wcard" id="wcard"></div>
</div>
<div class="flash" id="flash"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="상품과 화면 수정" aria-hidden="true">
  <div class="dh"><h2>상품·화면 수정</h2><button id="closeEdit">닫기</button></div>
  <section class="sec">
    <h3>상품 두 가지</h3>
    <p class="note">예시 값이에요. '칸 글자'는 구슬 판 아래 도착 칸에 쓰이는 짧은 이름이에요. 간식처럼 끝없이 줄 수 있는 상품은 <b>무제한</b>을 켜세요.</p>
    <div id="editor" style="display:grid;gap:10px"></div>
  </section>
  <section class="sec">
    <h3>당첨 확률</h3>
    <div class="pbig" id="pText"></div>
    <input type="range" id="pA" min="1" max="95" step="1" aria-label="첫 번째 상품 당첨 확률">
    <p class="note">한쪽 상품이 다 떨어지면 나머지 상품만 나와요. 구슬은 이 확률로 정해진 칸에 자연스럽게 튕기며 도착해요.</p>
  </section>
  <section class="sec">
    <h3>장애물 줄 수</h3>
    <p class="note">줄이 많을수록 구슬이 더 오래 튕기며 내려와요.</p>
    <div class="seg" id="seg"></div>
  </section>
  <section class="sec">
    <h3>화면 문구</h3>
    <label class="lbl">제목<input id="tIn" maxlength="24"></label>
    <label class="lbl">부제<input id="sIn" maxlength="60"></label>
  </section>
  <section class="sec">
    <h3>추첨 기록</h3>
    <ol class="hist" id="hist"></ol>
    <div class="mini"><button id="copy">기록 복사</button><button id="reset">처음부터 다시</button></div>
  </section>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=Math.PI*2,rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const okC=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#999999';
const KEY='chaek-plinko-v1';
const DEF={dv:2,sound:true,rows:12,pA:10,title:'책쓰샘 행운 추첨',sub:'구슬을 떨어뜨려 도서 또는 간식을 받아 가세요!',
  prizes:[{id:'book',name:'책쓰샘 저자 도서',short:'도서',qty:5,unl:false,color:'#e23b2e'},
          {id:'snack',name:'달콤한 간식',short:'간식',qty:0,unl:true,color:'#1f8a8a'}],hist:[]};
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.prizes)||S.prizes.length!==2||!Array.isArray(S.hist))S=JSON.parse(JSON.stringify(DEF));
if(S.dv!==2){S.pA=10;S.dv=2}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const used=id=>S.hist.filter(h=>h.pid===id).length;
const left=p=>p.unl?Infinity:Math.max(0,(+p.qty||0)-used(p.id));
const avail=p=>p.unl||left(p)>0;
const shortOf=p=>(p.short||p.name||'').trim().slice(0,4)||'?';
const lum=c=>{const n=parseInt(okC(c).slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000};
const mix=(c,t,a)=>{const n=parseInt(okC(c).slice(1),16),m=parseInt(t.slice(1),16);const f=s=>Math.round(((n>>s)&255)*(1-a)+((m>>s)&255)*a);return`rgb(${f(16)},${f(8)},${f(0)})`};
const ballHTML=(c,txt,cls)=>`<span class="ball ${cls||''}" style="--c:${okC(c)}">${esc(txt)}</span>`;
const A=()=>S.prizes[0],B=()=>S.prizes[1];
function probA(){const a=avail(A()),b=avail(B());if(!a&&!b)return null;if(!a)return 0;if(!b)return 100;return clamp(+S.pA||10,1,95)}

$('#stars').innerHTML=Array.from({length:22},()=>{const z=10+rnd()*26;return`<i style="left:${rnd()*100}%;top:${rnd()*100}%;width:${z}px;height:${z}px;--d:${1.2+rnd()*2.4}s;animation-delay:${-rnd()*3}s"></i>`}).join('');

/* 소리 */
let ac=null;
const actx=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();return ac}catch(e){return null}};
const tone=(f,d,type,v,delay)=>{if(!S.sound)return;const a=actx();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}};
const noise=(d,v,f,delay)=>{if(!S.sound)return;const a=actx();if(!a)return;try{const t=a.currentTime+(delay||0),b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(rnd()*2-1)*(1-i/ch.length);const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();bp.type='bandpass';bp.frequency.value=f||1200;g.gain.value=v||.3;s.buffer=b;s.connect(bp).connect(g).connect(a.destination);s.start(t)}catch(e){}};
let lastTick=0;
const ping=row=>{const n=performance.now();if(n-lastTick<28)return;lastTick=n;tone(520+row*55,.06,'triangle',.07)};
const fanfare=jack=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i>=4?.6:.16,'triangle',.1,i*.13));[1568,2093,2637].forEach((f,i)=>tone(f,.25,'sine',.04,.9+i*.08));noise(.25,.5,600,0);
  if(jack){[1047,1319,1568,2093].forEach((f,i)=>tone(f,.3,'square',.05,1.3+i*.1));noise(.2,.4,2400,.4);noise(.2,.4,2400,.8);noise(.2,.4,2400,1.2)}};

/* 구슬 판 구조 (판 단위 600×820) */
const BW=600,BH=820,L=24,RW=576,BR=12,PR=6,E=.5,G=1250,DT=1/120,NB=9,BTOP=690,FLOOR=790;
const binW=(RW-L)/NB;
let PEGS=[],ROWS=[];
function layout(){
  PEGS=[];ROWS=[];const n=clamp(+S.rows||12,6,16),gap=60,y0=150,y1=640;
  for(let i=0;i<n;i++){const y=y0+i*(y1-y0)/(n-1),row=[];const odd=i%2===1,cnt=odd?8:9,x0=odd?90:60;
    for(let j=0;j<cnt;j++){row.push(PEGS.length);PEGS.push({x:x0+j*gap,y,row:i,hit:-1e9})}ROWS.push({y,idx:row})}
}
const binPrize=k=>k%2===0?B():A();

/* 미리 계산하는 물리 — 같은 시작값이면 언제나 같은 길로 떨어져요 */
function sim(x0,vx0){
  const b={x:x0,y:70,vx:vx0,vy:0},fr=[],hits=[];let still=0,st=0;
  const hitCircle=(cx,cy,rad)=>{const dx=b.x-cx,dy=b.y-cy,m=BR+rad,d2=dx*dx+dy*dy;if(d2>=m*m)return 0;const d=Math.sqrt(d2)||1e-4;let nx=dx/d,ny=dy/d;
    if(Math.abs(nx)<.06&&ny<0){nx+=st%2?.1:-.1;const l=Math.hypot(nx,ny);nx/=l;ny/=l}
    b.x=cx+nx*m;b.y=cy+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+E)*vn*nx;b.vy-=(1+E)*vn*ny;const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty;b.vx-=vt*.05*tx;b.vy-=vt*.05*ty;return -vn}return 0};
  for(st=0;st<4200;st++){
    b.vy+=G*DT;b.vx*=.999;const sp=Math.hypot(b.vx,b.vy);if(sp>900){b.vx*=900/sp;b.vy*=900/sp}
    b.x+=b.vx*DT;b.y+=b.vy*DT;
    for(const r of ROWS){if(Math.abs(r.y-b.y)>BR+PR+2)continue;for(const i of r.idx){const v=hitCircle(PEGS[i].x,PEGS[i].y,PR);if(v>60)hits.push([st,i])}}
    for(let k=1;k<NB;k++){const dx=L+k*binW,cy=clamp(b.y,BTOP,FLOOR);hitCircle(dx,cy,3)}
    if(b.x<L+BR){b.x=L+BR;b.vx=Math.abs(b.vx)*E}if(b.x>RW-BR){b.x=RW-BR;b.vx=-Math.abs(b.vx)*E}
    if(b.y>FLOOR-BR){b.y=FLOOR-BR;b.vy=-Math.abs(b.vy)*.3;b.vx*=.8}
    fr.push(b.x,b.y);
    if(b.y>FLOOR-BR-2&&Math.abs(b.vy)<40&&Math.abs(b.vx)<25){if(++still>40)break}else still=0;
  }
  return{fr,hits,bin:clamp(Math.floor((b.x-L)/binW),0,NB-1)};
}
function plan(target){
  let last=null;
  for(let t=0;t<800;t++){const r=sim(300+(rnd()-.5)*70,(rnd()-.5)*90);last=r;if(binPrize(r.bin)===target)return r}
  return last;
}

/* 그리기 */
const cv=$('#board'),ctx=cv.getContext('2d'),wrapEl=$('#boardWrap');
let W=0,dpr=1,dots=null;
const ro=new ResizeObserver(()=>{W=wrapEl.clientWidth;dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(W*BH/BW*dpr)});
ro.observe(wrapEl);
function halftone(){const c=document.createElement('canvas');c.width=c.height=12;const x=c.getContext('2d');x.fillStyle='rgba(255,243,214,.07)';x.beginPath();x.arc(6,6,1.6,0,T);x.fill();return ctx.createPattern(c,'repeat')}
const ball={x:300,y:60},trail=[];
let phase='idle',landBin=null,winUntil=0;
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function draw(now){
  if(!W)return;const sc=W/BW*dpr;ctx.setTransform(sc,0,0,sc,0,0);ctx.clearRect(0,0,BW,BH);
  if(!dots)dots=halftone();
  rr(3,3,BW-6,BH-6,30);ctx.fillStyle='#2b130b';ctx.fill();ctx.lineWidth=6;ctx.strokeStyle='#f2b632';ctx.stroke();
  const bg=ctx.createLinearGradient(0,90,0,BH);bg.addColorStop(0,'#5a1d12');bg.addColorStop(1,'#1e0c06');
  rr(L-4,96,RW-L+8,FLOOR-96+10,14);ctx.fillStyle=bg;ctx.fill();ctx.fillStyle=dots;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#a8141d';ctx.stroke();
  // 전구
  const bulbs=[];for(let y=40;y<=BH-30;y+=38){bulbs.push([12,y],[BW-12,y])}for(let x=60;x<=BW-60;x+=40)bulbs.push([x,12]);
  bulbs.forEach(([x,y],i)=>{const lit=now<winUntil?Math.floor(now/110)%2===0:phase!=='idle'?(i+Math.floor(now/60))%3===0:(i+Math.floor(now/480))%2===0;
    if(lit){const g=ctx.createRadialGradient(x,y,0,x,y,16);g.addColorStop(0,'rgba(255,246,200,.9)');g.addColorStop(1,'rgba(255,120,180,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,16,0,T);ctx.fill()}
    ctx.beginPath();ctx.arc(x,y,5.5,0,T);ctx.fillStyle=lit?'#fff9dc':'#7a2a1a';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#2b130b';ctx.stroke()});
  // 구슬 넣는 깔때기
  ctx.beginPath();ctx.moveTo(220,26);ctx.lineTo(380,26);ctx.lineTo(340,94);ctx.lineTo(260,94);ctx.closePath();
  const hg=ctx.createLinearGradient(220,0,380,0);hg.addColorStop(0,'#9a5a0c');hg.addColorStop(.4,'#ffe08a');hg.addColorStop(.6,'#f2b632');hg.addColorStop(1,'#8a4c08');
  ctx.fillStyle=hg;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#2b130b';ctx.stroke();
  ctx.fillStyle='#2b130b';ctx.font='900 15px Paperlogy, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('LUCKY DROP',300,42);
  // 핀
  for(const p of PEGS){const f=Math.max(0,1-(now-p.hit)/420);
    if(f>0){ctx.beginPath();ctx.arc(p.x,p.y,PR+4+16*(1-f),0,T);ctx.strokeStyle=`rgba(255,79,163,${f})`;ctx.lineWidth=3;ctx.stroke();
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,22);g.addColorStop(0,`rgba(255,240,170,${.8*f})`);g.addColorStop(1,'rgba(255,240,170,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,22,0,T);ctx.fill()}
    ctx.beginPath();ctx.arc(p.x+1.5,p.y+2,PR,0,T);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();
    ctx.beginPath();ctx.arc(p.x,p.y,PR,0,T);ctx.fillStyle=f>0?'#ffe08a':'#fff3d6';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#2b130b';ctx.stroke()}
  // 도착 칸
  for(let k=0;k<NB;k++){const p=binPrize(k),c=okC(p.color),x=L+k*binW,out=!avail(p);
    const g=ctx.createLinearGradient(0,BTOP,0,FLOOR);g.addColorStop(0,mix(c,'#ffffff',.15));g.addColorStop(1,mix(c,'#2b130b',.35));
    ctx.fillStyle=g;ctx.fillRect(x,BTOP,binW,FLOOR-BTOP);
    ctx.fillStyle='rgba(255,255,255,.08)';for(let s=0;s<4;s++)ctx.fillRect(x+6+s*14,BTOP,5,FLOOR-BTOP);
    if(out){ctx.fillStyle='rgba(43,19,11,.6)';ctx.fillRect(x,BTOP,binW,FLOOR-BTOP)}
    if(landBin===k){const pu=.5+.5*Math.sin(now/120);ctx.fillStyle=`rgba(255,243,214,${.25+.35*pu})`;ctx.fillRect(x,BTOP,binW,FLOOR-BTOP);
      ctx.save();ctx.shadowColor='#ff4fa3';ctx.shadowBlur=30;ctx.strokeStyle='#fff3d6';ctx.lineWidth=4;ctx.strokeRect(x+2,BTOP+2,binW-4,FLOOR-BTOP-4);ctx.restore()}
    ctx.save();ctx.translate(x+binW/2,BTOP+64);const lt=lum(c)>165;ctx.fillStyle=out?'rgba(255,243,214,.6)':lt?'#2b130b':'#fff3d6';
    const lab=out?'품절':shortOf(p);ctx.font=`900 ${lab.length>2?15:19}px Paperlogy, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowOffsetX=1.5;ctx.shadowOffsetY=1.5;ctx.fillText(lab,0,0);ctx.restore()}
  for(let k=1;k<NB;k++){const x=L+k*binW;ctx.fillStyle='#fff3d6';ctx.fillRect(x-3,BTOP,6,FLOOR-BTOP);ctx.strokeStyle='#2b130b';ctx.lineWidth=1.5;ctx.strokeRect(x-3,BTOP,6,FLOOR-BTOP);
    ctx.beginPath();ctx.arc(x,BTOP,6,0,T);ctx.fillStyle='#f2b632';ctx.fill();ctx.stroke()}
  ctx.fillStyle='#2b130b';ctx.fillRect(L-4,FLOOR,RW-L+8,10);
  // 구슬과 꼬리
  if(phase==='idle'){ball.x=300;ball.y=64+Math.sin(now/280)*2.5}
  trail.forEach((t,i)=>{const a=(i+1)/trail.length;ctx.beginPath();ctx.arc(t[0],t[1],BR*(.35+.55*a),0,T);ctx.fillStyle=`rgba(255,79,163,${.22*a})`;ctx.fill()});
  const gl=ctx.createRadialGradient(ball.x,ball.y,0,ball.x,ball.y,BR*2.6);gl.addColorStop(0,'rgba(255,230,140,.55)');gl.addColorStop(1,'rgba(255,230,140,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(ball.x,ball.y,BR*2.6,0,T);ctx.fill();
  const bg2=ctx.createRadialGradient(ball.x-4,ball.y-5,1,ball.x,ball.y,BR);bg2.addColorStop(0,'#ffffff');bg2.addColorStop(.3,'#ffe08a');bg2.addColorStop(.8,'#f2b632');bg2.addColorStop(1,'#a86a08');
  ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,T);ctx.fillStyle=bg2;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#2b130b';ctx.stroke();
}
const loop=now=>{if(!document.hidden)draw(now);requestAnimationFrame(loop)};
if(document.fonts){['400','800','900'].forEach(w=>document.fonts.load(w+' 20px Paperlogy').catch(()=>{}))}

/* 떨어뜨리기 */
function drop(){
  if(!$('#win').hidden){closeWin();return}
  if(phase!=='idle')return;
  const pa=probA();if(pa===null){toast('남은 상품이 없어요. 수량을 늘리거나 처음부터 다시 시작하세요.');return}
  const target=rnd()*100<pa?A():B();
  const r=plan(target),win=binPrize(r.bin);
  phase='aim';busy(true);landBin=null;trail.length=0;
  const x0=r.fr[0],t0=performance.now(),aimDur=RM?0:650;
  tone(330,.12,'square',.05);tone(440,.12,'square',.05,.12);
  const aim=now=>{const k=Math.min(1,(now-t0)/Math.max(1,aimDur)),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    ball.x=300+(x0-300)*e+Math.sin(k*Math.PI*4)*10*(1-k);ball.y=64+(70-64)*e;
    if(k<1)requestAnimationFrame(aim);else{phase='drop';play(r,win)}};
  requestAnimationFrame(aim);
}
function play(r,win){
  const n=r.fr.length/2;let pos=0,prev=performance.now(),hi=0;
  if(RM){ball.x=r.fr[(n-1)*2];ball.y=r.fr[(n-1)*2+1];land(r,win);return}
  const st=now=>{const dt=Math.min(.05,(now-prev)/1000);prev=now;
    const slow=ball.y>600&&ball.y<FLOOR-BR-4?.5:1;pos=Math.min(n-1,pos+dt*120*slow);
    const i=Math.floor(pos);ball.x=r.fr[i*2];ball.y=r.fr[i*2+1];
    trail.push([ball.x,ball.y]);if(trail.length>12)trail.shift();
    while(hi<r.hits.length&&r.hits[hi][0]<=i){const p=PEGS[r.hits[hi][1]];p.hit=now;ping(p.row);hi++}
    if(pos<n-1)requestAnimationFrame(st);else land(r,win)};
  requestAnimationFrame(st);
}
function land(r,p){
  trail.length=0;landBin=r.bin;phase='done';tone(110,.3,'sine',.25);noise(.12,.4,400);
  const pa=probA(),pct=p===A()?pa:100-pa,jack=pct<50;
  S.hist.push({pid:p.id,name:p.name,short:shortOf(p),color:okC(p.color),t:Date.now(),jack});save();
  winUntil=performance.now()+3500;busy(false);render(true);celebrate(okC(p.color),jack);
  setTimeout(()=>showWin(S.hist[S.hist.length-1]),RM?0:700);
}
function busy(b){['#go','#undo','#reset','#openEdit'].forEach(s=>$(s).disabled=b)}
function showWin(h){
  $('#win').classList.toggle('jack',!!h.jack);
  $('#wcard').innerHTML=`<p class="wk big">${h.jack?'대박!':'축하합니다!'}</p>${ballHTML(h.color,h.short,'wball')}<div class="wname big">${esc(h.name)}</div><button class="wok" id="wok">확인 (스페이스바)</button>`;
  $('#win').hidden=false;$('#wok').focus();
}
function closeWin(){if($('#win').hidden)return;$('#win').hidden=true;landBin=null;phase='idle';render()}
$('#win').addEventListener('click',closeWin);

/* 화려한 효과 */
const fx=$('#fx'),fc=fx.getContext('2d');let P=[],fxOn=false;
function celebrate(c,jack){
  const fl=$('#flash');fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on');
  const ap=$('#app');ap.classList.remove('shake');void ap.offsetWidth;ap.classList.add('shake');
  fanfare(jack);if(RM)return;
  fx.width=innerWidth;fx.height=innerHeight;const Wd=fx.width,H=fx.height;
  const cols=[c,'#fff3d6','#f2b632','#d8252e','#ff4fa3','#1f8a8a','#ffffff'];
  const cannon=(x,ang,n)=>{for(let i=0;i<n;i++){const a=ang+(rnd()-.5)*.55,v=14+rnd()*14;P.push({k:'c',x,y:H+10,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:7+rnd()*8,c:cols[i%cols.length],r:rnd()*6,vr:(rnd()-.5)*.4,life:1,dec:.0035})}};
  const burst=()=>{const x=Wd*(.15+rnd()*.7),y=H*(.12+rnd()*.38),bc=cols[Math.floor(rnd()*cols.length)];noise(.18,.25,1800);
    for(let i=0;i<110;i++){const a=i/110*T,v=2+rnd()*6.5;P.push({k:'s',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:rnd()<.3?'#fffbe6':bc,life:1,dec:.011+rnd()*.012})}};
  const coins=n=>{for(let i=0;i<n;i++)P.push({k:'g',x:rnd()*Wd,y:-20-rnd()*H*.6,vx:(rnd()-.5)*1.2,vy:2+rnd()*3,s:4+rnd()*5,r:rnd()*6,vr:.1+rnd()*.2,life:1,dec:.002})};
  cannon(0,-Math.PI/2+.55,140);cannon(Wd,-Math.PI/2-.55,140);
  setTimeout(()=>{cannon(0,-Math.PI/2+.35,120);cannon(Wd,-Math.PI/2-.35,120)},700);
  for(let b=0;b<(jack?16:8);b++)setTimeout(burst,250+b*(jack?220:330));
  coins(jack?200:80);
  if(jack)setTimeout(()=>{cannon(Wd*.5,-Math.PI/2,220);coins(120)},1500);
  if(!fxOn){fxOn=true;requestAnimationFrame(fxStep)}
}
function fxStep(){
  const H=fx.height;fc.clearRect(0,0,fx.width,H);
  for(const p of P){
    if(p.k==='c'){p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=p.dec;fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.fillRect(-p.s/2,-p.s*.3,p.s,p.s*.6);fc.restore()}
    else if(p.k==='s'){p.vy+=.06;p.vx*=.975;p.vy*=.975;p.x+=p.vx;p.y+=p.vy;p.life-=p.dec;fc.globalCompositeOperation='lighter';fc.globalAlpha=Math.max(0,p.life);fc.fillStyle=p.c;fc.beginPath();fc.arc(p.x,p.y,2.4,0,T);fc.fill();fc.globalAlpha=1;fc.globalCompositeOperation='source-over'}
    else{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=p.dec;const w=Math.abs(Math.cos(p.r))*p.s+1;fc.fillStyle='#f2b632';fc.beginPath();fc.ellipse(p.x,p.y,w,p.s,0,0,T);fc.fill();fc.fillStyle='#fff6c9';fc.beginPath();fc.ellipse(p.x-w*.3,p.y-p.s*.3,w*.3,p.s*.3,0,0,T);fc.fill()}
  }
  P=P.filter(p=>p.life>0&&p.y<H+40);
  if(P.length)requestAnimationFrame(fxStep);else{fxOn=false;fc.clearRect(0,0,fx.width,H)}
}

  $('#pA').value=clamp(+S.pA||10,1,95);renderPText();
  $('#seg').innerHTML=[8,10,12,14].map(n=>`<button data-n="${n}" aria-pressed="${+S.rows===n}">${n}줄</button>`).join('');
  $('#tIn').value=S.title||'';$('#sIn').value=S.sub||'';
}
function renderPText(){const v=clamp(+S.pA||10,1,95);$('#pText').textContent=`${A().name} ${v}% · ${B().name} ${100-v}%`}
function render(fresh){renderHead();renderOdds();renderBalls(fresh);renderHist();renderSnd()}

/* 이벤트 */
$('#go').onclick=drop;cv.addEventListener('click',drop);
$('#undo').onclick=()=>{if(phase==='aim'||phase==='drop')return;if(!S.hist.length){toast('되돌릴 결과가 없어요.');return}closeWin();const h=S.hist.pop();save();landBin=null;render();toast(`${h.name} 결과를 되돌렸어요.`)};
$('#snd').onclick=()=>{S.sound=!S.sound;save();renderSnd();if(S.sound)ping(4)};
$('#fs').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>toast('이 화면에서는 전체 화면을 쓸 수 없어요.'))}catch(e){toast('이 화면에서는 전체 화면을 쓸 수 없어요.')}};
const dr=$('#drawer'),scrim=$('#scrim');
const openD=()=>{if(phase==='aim'||phase==='drop')return;closeWin();renderEditor();renderHist();scrim.hidden=false;dr.classList.add('open');dr.setAttribute('aria-hidden','false');setTimeout(()=>$('#closeEdit').focus(),50)};
const closeD=()=>{dr.classList.remove('open');dr.setAttribute('aria-hidden','true');scrim.hidden=true;$('#openEdit').focus()};
$('#openEdit').onclick=openD;$('#closeEdit').onclick=closeD;scrim.onclick=closeD;
$('#editor').addEventListener('input',e=>{
  const row=e.target.closest('.pe');if(!row)return;const p=S.prizes[+row.dataset.i];if(!p)return;const t=e.target;
  if(t.type==='color')p.color=okC(t.value);
  else if(t.classList.contains('pn'))p.name=t.value.trim()||'이름 없는 상품';
  else if(t.classList.contains('ps'))p.short=t.value.trim();
  else if(t.classList.contains('pq'))p.qty=Math.max(0,Math.min(999,parseInt(t.value,10)||0));
  else if(t.classList.contains('pu')){p.unl=t.checked;if(!p.unl&&!(+p.qty))p.qty=5;save();render();renderEditor();return}
  save();render();renderPText();
});
$('#pA').addEventListener('input',e=>{S.pA=+e.target.value;save();renderPText();renderOdds()});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.rows=+b.dataset.n;save();layout();renderEditor()});
$('#tIn').addEventListener('input',e=>{S.title=e.target.value;save();renderHead()});
$('#sIn').addEventListener('input',e=>{S.sub=e.target.value;save();renderHead()});
$('#copy').onclick=()=>{if(!S.hist.length){toast('복사할 기록이 없어요.');return}
  const cnt=S.prizes.map(p=>`${p.name} ${used(p.id)}회`).join(', ');
  const txt=`${S.title||''} 추첨 기록 (${cnt})\n`+S.hist.map((h,i)=>`${i+1}. ${h.name} (${hm(h.t)})`).join('\n');
  try{navigator.clipboard.writeText(txt).then(()=>toast('추첨 기록을 복사했어요.'),()=>toast('복사가 막혀 있어요.'))}catch(e){toast('복사가 막혀 있어요.')}};
let rs=null;
$('#reset').onclick=()=>{const b=$('#reset');
  if(!rs){b.textContent='한 번 더 누르면 기록이 지워져요';rs=setTimeout(()=>{rs=null;b.textContent='처음부터 다시'},3000);return}
  clearTimeout(rs);rs=null;b.textContent='처음부터 다시';S.hist=[];save();landBin=null;render();renderHist();toast('기록을 지우고 수량을 처음으로 되돌렸어요.')};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#win').hidden)closeWin();else if(dr.classList.contains('open'))closeD();return}
  if(e.code!=='Space'||dr.classList.contains('open'))return;
  const tag=document.activeElement&&document.activeElement.tagName;
  if(!$('#win').hidden){e.preventDefault();closeWin();return}
  if(!['INPUT','TEXTAREA','BUTTON'].includes(tag)){e.preventDefault();drop()}
});

layout();render();requestAnimationFrame(loop);
}
</script>
</body>
</html>
